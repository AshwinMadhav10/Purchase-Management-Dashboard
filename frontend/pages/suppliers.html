<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supplier Master — Purchase Management</title>
  <meta name="description" content="Manage supplier master data including CRUD operations and search." />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
<div class="app-wrapper">
  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger-btn" aria-label="Toggle sidebar">☰</button>
      <div class="topbar-title">
        <h1>Supplier Master</h1>
        <p>Manage your supplier records</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="btn-add-supplier">＋ Add Supplier</button>
      </div>
    </header>

    <main class="page-content">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Suppliers <span id="supplier-count" class="text-muted" style="font-weight:400;font-size:13px;"></span></span>
          <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" class="form-control" id="supplier-search" placeholder="Search suppliers…" />
          </div>
        </div>
        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>Supplier ID</th>
                <th>Code</th>
                <th>Name</th>
                <th>Contact</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Payment Terms</th>
                <th>Status</th>
                <th class="actions-cell">Actions</th>
              </tr>
            </thead>
            <tbody id="suppliers-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add / Edit Supplier Modal -->
<div class="modal-overlay" id="supplier-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="supplier-modal-title">Add Supplier</span>
      <button class="modal-close" data-close="supplier-modal">✕</button>
    </div>
    <div class="modal-body">
      <form id="supplier-form" novalidate>
        <input type="hidden" id="supplier-id" name="id" />
        <div class="form-row cols-2">
          <div class="form-group">
            <label class="form-label">Supplier Name <span class="required">*</span></label>
            <input type="text" class="form-control" name="name" id="sf-name" placeholder="e.g. ABC Traders" />
          </div>
          <div class="form-group">
            <label class="form-label">Contact Person <span class="required">*</span></label>
            <input type="text" class="form-control" name="contact_person" id="sf-contact" placeholder="e.g. John Doe" />
          </div>
        </div>
        <div class="form-row cols-2">
          <div class="form-group">
            <label class="form-label">Phone <span class="required">*</span></label>
            <input type="tel" class="form-control" name="phone" id="sf-phone" placeholder="e.g. +91 98765 43210" />
          </div>
          <div class="form-group">
            <label class="form-label">Email <span class="required">*</span></label>
            <input type="email" class="form-control" name="email" id="sf-email" placeholder="e.g. info@abc.com" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <textarea class="form-control" name="address" id="sf-address" rows="2" placeholder="Full address"></textarea>
        </div>
        <div class="form-row cols-2">
          <div class="form-group">
            <label class="form-label">Tax / VAT Number</label>
            <input type="text" class="form-control" name="tax_number" id="sf-tax" placeholder="e.g. GSTIN" />
          </div>
          <div class="form-group">
            <label class="form-label">Payment Terms</label>
            <select class="form-control" name="payment_terms" id="sf-terms">
              <option value="">— Select —</option>
              <option value="Net 15">Net 15</option>
              <option value="Net 30">Net 30</option>
              <option value="Net 45">Net 45</option>
              <option value="Net 60">Net 60</option>
              <option value="Immediate">Immediate</option>
              <option value="COD">COD</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-control" name="status" id="sf-status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close="supplier-modal">Cancel</button>
      <button class="btn btn-primary" id="btn-save-supplier">Save Supplier</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="../js/sidebar.js"></script>
<script src="../js/api.js"></script>
<script src="../js/common.js"></script>
<script src="../js/suppliers.js"></script>
</body>
</html>
